name: IaC Checks

on:
  push:
  pull_request:

concurrency:
  group: iac-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  bicep-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and lint Bicep
        uses: azure/cli@v2
        with:
          inlineScript: |
            az bicep install
            az bicep version
            az bicep build --file infra/aca/bicep/main.bicep

  terraform-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: infra/aca/terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform init (no backend)
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

      - name: Azure login for plan (OIDC)
        if: ${{ vars.AZURE_CLIENT_ID != '' && vars.AZURE_TENANT_ID != '' && vars.AZURE_SUBSCRIPTION_ID != '' }}
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform plan
        if: ${{ vars.AZURE_CLIENT_ID != '' && vars.AZURE_TENANT_ID != '' && vars.AZURE_SUBSCRIPTION_ID != '' }}
        env:
          ARM_USE_OIDC: true
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          terraform plan -refresh=false -lock=false -input=false \
            -var="resource_group_name=aegischain-ci-rg" \
            -var="location=eastus" \
            -var="name_prefix=aegischainci" \
            -var="container_image=example.azurecr.io/aegischain:latest" \
            -var="jwt_secret=ci-check-secret" \
            -var="cors_origin=https://example.com" \
            -var="enable_cosmos=false"

      - name: Explain skipped plan
        if: ${{ !(vars.AZURE_CLIENT_ID != '' && vars.AZURE_TENANT_ID != '' && vars.AZURE_SUBSCRIPTION_ID != '') }}
        run: echo "Terraform plan skipped because Azure OIDC repository variables are not configured."
